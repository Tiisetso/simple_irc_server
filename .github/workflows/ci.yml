name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build
        run: make re

      - name: Verify binary exists
        run: test -x ./ircserv
  
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential netcat-openbsd

      - name: Build
        run: make re
        
      - name: Smoke test - server accepts clients
        run: |
          ./ircserv 16667 testpass > server.log 2>&1 &
          SERVER_PID=$!
          sleep 0.5
          printf 'hello\n' | nc -w 2 127.0.0.1 16667
          printf 'world\n' | nc -w 2 127.0.0.1 16667
          sleep 0.5
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          grep -q "New client" server.log
          grep -q "Received:" server.log

      - name: Smoke test - USER not enough params
        run: |
          ./ircserv 16668 testpass > server_user.log 2>&1 &
          SERVER_PID=$!
          sleep 0.5
          REPLY=$(printf 'USER guest\r\n' | nc -w 2 127.0.0.1 16668)
          sleep 0.5
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          echo "$REPLY" | grep -q "461"

      - name: Null byte - server parses the full msg
        run: |
          ./ircserv 6000 testpass > server_null.log 2>&1 &
          SERVER_PID=$!
          sleep 0.5
          printf 'null\0byte\r\n' | nc -w 2 127.0.0.1 6000
          sleep 0.5
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          grep -q "Received: 11 bytes" server_null.log
        