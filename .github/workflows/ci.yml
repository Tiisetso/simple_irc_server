name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 102-smoke-test-9-cap-ls-cap-end-registration-flow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build binary
        run: make

      - name: Verify binary exists
        run: test -x ./ircserv

      - name: Upload compiled binary
        uses: actions/upload-artifact@v7
        with:
          name: ircserv-binary
          path: ./ircserv

  smoke_test_1:
    name: "Smoke Test 1: Accept Clients"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled binary
        uses: actions/download-artifact@v7
        with:
          name: ircserv-binary

      - name: Fix binary permissions
        run: chmod +x ./ircserv

      - name: Run test
        run: |
          ./ircserv 16667 testpass > server.log 2>&1 &
          SERVER_PID=$!
          sleep 0.5
          printf 'hello\n' | nc -w 2 127.0.0.1 16667
          printf 'world\n' | nc -w 2 127.0.0.1 16667
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          grep -q "New client" server.log
          grep -q "Received:" server.log

  smoke_test_2:
    name: "Smoke Test 2: USER missing params"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled binary
        uses: actions/download-artifact@v7
        with:
          name: ircserv-binary

      - name: Fix binary permissions
        run: chmod +x ./ircserv

      - name: Run test
        run: |
          ./ircserv 16668 testpass > server_user.log 2>&1 &
          SERVER_PID=$!
          sleep 0.5
          REPLY=$(printf 'USER guest\r\n' | nc -w 2 127.0.0.1 16668)
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          echo "$REPLY" | grep -q "461"

  smoke_test_3:
    name: "Smoke Test 3: Null Byte Parsing"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled binary
        uses: actions/download-artifact@v7
        with:
          name: ircserv-binary

      - name: Fix binary permissions
        run: chmod +x ./ircserv

      - name: Run test
        run: |
          ./ircserv 6000 testpass > server_null.log 2>&1 &
          SERVER_PID=$!
          sleep 0.5
          printf 'null\0byte\r\n' | nc -w 2 127.0.0.1 6000
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          grep -q "Received: 11 bytes" server_null.log

  smoke_test_4:
    name: "Smoke Test 4: NICK missing params"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled binary
        uses: actions/download-artifact@v7
        with:
          name: ircserv-binary

      - name: Fix binary permissions
        run: chmod +x ./ircserv

      - name: Run test
        run: |
          ./ircserv 16669 testpass > server_nick_empty.log 2>&1 &
          SERVER_PID=$!
          sleep 0.5
          REPLY=$(printf 'NICK\r\n' | nc -w 2 127.0.0.1 16669)
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          echo "$REPLY" | grep -q "431"

  smoke_test_5:
    name: "Smoke Test 5: NICK erroneous (bad first char)"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled binary
        uses: actions/download-artifact@v7
        with:
          name: ircserv-binary

      - name: Fix binary permissions
        run: chmod +x ./ircserv

      - name: Run test
        run: |
          ./ircserv 16670 testpass > server_nick_bad.log 2>&1 &
          SERVER_PID=$!
          sleep 0.5
          REPLY=$(printf 'NICK 1bob\r\n' | nc -w 2 127.0.0.1 16670)
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          echo "$REPLY" | grep -q "432"

  smoke_test_6:
    name: "Smoke Test 6: NICK in use"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled binary
        uses: actions/download-artifact@v7
        with:
          name: ircserv-binary

      - name: Fix binary permissions
        run: chmod +x ./ircserv

      - name: Run test
        run: |
          ./ircserv 16671 testpass > server_nick_inuse.log 2>&1 &
          SERVER_PID=$!
          sleep 0.5
          # hold first client open so nick stays taken
          mkfifo /tmp/irc_c1_in
          nc 127.0.0.1 16671 < /tmp/irc_c1_in > /tmp/irc_c1_out &
          NC1_PID=$!
          printf 'PASS testpass\r\nNICK alice\r\nUSER alice 0 * :Alice\r\n' > /tmp/irc_c1_in
          sleep 0.5
          REPLY=$(printf 'PASS testpass\r\nNICK alice\r\n' | nc -w 2 127.0.0.1 16671)
          kill $NC1_PID $SERVER_PID
          wait $NC1_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          rm -f /tmp/irc_c1_in
          echo "$REPLY" | grep -q "433"

  smoke_test_7:
    name: "Smoke Test 7: NICK case-insensitive collision"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled binary
        uses: actions/download-artifact@v7
        with:
          name: ircserv-binary

      - name: Fix binary permissions
        run: chmod +x ./ircserv

      - name: Run test
        run: |
          ./ircserv 16672 testpass > server_nick_case.log 2>&1 &
          SERVER_PID=$!
          sleep 0.5
          mkfifo /tmp/irc_c1_case
          nc 127.0.0.1 16672 < /tmp/irc_c1_case > /tmp/irc_c1_case_out &
          NC1_PID=$!
          printf 'PASS testpass\r\nNICK Alice\r\nUSER alice 0 * :Alice\r\n' > /tmp/irc_c1_case
          sleep 0.5
          REPLY=$(printf 'PASS testpass\r\nNICK ALICE\r\n' | nc -w 2 127.0.0.1 16672)
          kill $NC1_PID $SERVER_PID
          wait $NC1_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          rm -f /tmp/irc_c1_case
          echo "$REPLY" | grep -q "433"

  smoke_test_8:
    name: "Smoke Test 8: Successful registration sends welcome numeric 001"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled binary
        uses: actions/download-artifact@v7
        with:
          name: ircserv-binary

      - name: Fix binary permissions
        run: chmod +x ./ircserv

      - name: Run test
        run: |
          ./ircserv 16673 testpass > server_registration.log 2>&1 &
          SERVER_PID=$!
          sleep 0.5

          REPLY_ALICE=$(printf 'PASS testpass\r\nNICK alice\r\nUSER alice 0 * :Alice\r\n' | nc -w 2 127.0.0.1 16673)

          REPLY_BOB=$(printf 'PASS testpass\r\nNICK bob\r\nUSER bob 0 * :Bob\r\n' | nc -w 2 127.0.0.1 16673)

          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true

          echo "Alice's reply:"
          echo "$REPLY_ALICE"

          echo "Bob's reply:"
          echo "$REPLY_BOB"

          echo "$REPLY_ALICE" | grep -q " 001 alice "
          echo "$REPLY_BOB" | grep -q " 001 bob "

  smoke_test_9:
    name: "Smoke Test 9: CAP response registration flow"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled binary
        uses: actions/download-artifact@v7
        with:
          name: ircserv-binary

      - name: Fix binary permissions
        run: chmod +x ./ircserv

      - name: Run test
        run: |
          ./ircserv 16674 testpass > server_cap.log 2>&1 &
          SERVER_PID=$!
          sleep 0.5

          REPLY=$(printf 'CAP LS 302\r\nPASS testpass\r\nNICK alice\r\nUSER alice 0 * :Alice\r\nCAP END\r\n' | nc -w 2 127.0.0.1 16674)

          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true

          echo "Server reply:"
          echo "$REPLY"

          echo "$REPLY" | grep -q " CAP * LS : "
          echo "$REPLY" | grep -q " 001 alice "